[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isis-study-agent"
version = "0.1.0"
description = "ISIS-Study-Agent (TU Berlin Moodle): Kurs-Sync, Lernunterlagen, Prüfungsvorbereitung und Lernpodcast mit Claude"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pypdf>=4.0", "edge-tts>=7.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
isis-agent = "isis_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isis_agent = ["cloudflare_worker.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["templates", "isis_daten", "kurse"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
